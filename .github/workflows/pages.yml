name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 以 demo-a-macos-desktop 作为站点首页（仓库中不保留 index.html）
        run: |
          cp portfolio-demos/demo-a-macos-desktop.html index.html
          sed -i \
            -e 's|\.\./index-notion\.html|index-notion.html|g' \
            -e 's|\.\./index-readless\.html|index-readless.html|g' \
            -e 's|\.\./index%20mindmap\.html|index%20mindmap.html|g' \
            -e 's|\.\./landing-repaste\.html|landing-repaste.html|g' \
            -e 's|"embed-readless\.html|"portfolio-demos/embed-readless.html|g' \
            -e 's|"embed-repaste\.html|"portfolio-demos/embed-repaste.html|g' \
            -e 's|"embed-wtd\.html|"portfolio-demos/embed-wtd.html|g' \
            -e 's|"readless-app-icon\.png|"portfolio-demos/readless-app-icon.png|g' \
            -e 's|"repaste-app-icon\.svg|"portfolio-demos/repaste-app-icon.svg|g' \
            -e 's|"wtd-app-icon\.png|"portfolio-demos/wtd-app-icon.png|g' \
            index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
