name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 检查首页资源与旧入口同步
        run: python3 scripts/sync-homepage.py --check
      - name: 检查展厅资源完整性
        run: python3 scripts/check-gallery-assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查展厅交互与音乐
        run: |
          node tests/gallery/check-motion.cjs
          node tests/gallery/check-upgrade-lifecycle.cjs
          node tests/gallery/check-music-lifecycle.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
